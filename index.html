<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sloterias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkBg: '#0B0B0B', darkCard: '#1A1A1A', primaryYellow: '#F6C20F' } } }
        }
    </script>
</head>
<body class="bg-darkBg text-white h-screen flex items-center justify-center font-sans">

    <div class="bg-darkCard p-8 rounded-xl border border-gray-800 shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-primaryYellow mb-6">Sloterias</h2>
        <p class="text-gray-400 text-center mb-8 text-sm">Ingresa tu usuario y contraseña para acceder al panel.</p>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Nombre de Usuario (Ej: Amanda008)</label>
                <input type="text" id="loginUsuario" required class="w-full px-4 py-3 rounded-lg bg-black border border-gray-700 text-white focus:border-primaryYellow focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Contraseña</label>
                <input type="password" id="loginPass" required class="w-full px-4 py-3 rounded-lg bg-black border border-gray-700 text-white focus:border-primaryYellow focus:outline-none">
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-primaryYellow text-black font-bold py-3 rounded-lg hover:bg-yellow-500 transition mt-4">
                Entrar al Panel
            </button>
        </form>
    </div>

    <script>
        // COLOQUE SUAS CHAVES DO FIREBASE AQUI
         const firebaseConfig = {
        apiKey: "AIzaSyACSWWVqzpvnozGfi8McSVkhWjV5aorfpo",
        authDomain: "cajeros-painel-central.firebaseapp.com",
        projectId: "cajeros-painel-central",
        storageBucket: "cajeros-painel-central.firebasestorage.app",
        messagingSenderId: "517349736731",
        appId: "1:517349736731:web:70efc48181746d0da393be"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerText = "Conectando..."; btn.disabled = true;
            
            // O TRUQUE MÁGICO DO E-MAIL INVISÍVEL
            let usuario = document.getElementById('loginUsuario').value.trim().toLowerCase().replace(/\s/g, '');
            let emailFormatado = usuario.includes('@') ? usuario : usuario + "@sloterias.com";
            let pass = document.getElementById('loginPass').value;

            auth.signInWithEmailAndPassword(emailFormatado, pass)
            .then((userCredential) => {
                window.location.href = "dashboard.html"; // Redireciona para o Painel
            })
            .catch((error) => {
                alert("❌ Usuario o contraseña incorrectos.");
                btn.innerText = "Entrar al Panel"; btn.disabled = false;
            });
        });
    </script>
</body>
</html>
